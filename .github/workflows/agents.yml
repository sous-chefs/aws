---
name: host-agents

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_AGENT_PACKAGE_DIR: /tmp/aws-agent-packages
      KITCHEN_YAML: kitchen.agents.yml
      KITCHEN_LOCAL_YAML: kitchen.agents.yml
    steps:
      - uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.1
      - name: Unit tests with Cinc Workstation
        run: chef exec rspec
      - name: Prepare verified packages and isolated network
        run: sh test/prepare-agents.sh
      - name: Converge twice and verify agents
        run: kitchen test default-ubuntu-2404 --destroy=never
      - name: Remove twice and verify cleanup
        run: |
          export AWS_AGENT_RUN_LIST=remove
          kitchen converge default-ubuntu-2404
          kitchen verify default-ubuntu-2404 --test-base-path=test/integration/remove
      - name: Destroy test container
        if: always()
        run: kitchen destroy default-ubuntu-2404
      - name: Clean up test network
        if: always()
        run: docker network rm aws-agents-offline
